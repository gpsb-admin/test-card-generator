<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCS test card generator</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f3f5f8; color: #1d2733; }
  main { max-width: 980px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 24px auto 0; max-width: 980px; padding: 0 16px; }
  .sub { max-width: 980px; margin: 4px auto 0; padding: 0 16px; color: #5b6678; font-size: 14px; }
  .panel { background: #fff; border: 1px solid #dde3ea; border-radius: 12px; padding: 16px; }
  label { display: block; font-size: 13px; color: #5b6678; margin: 12px 0 4px; }
  input[type=text], textarea, select { width: 100%; padding: 9px 11px; border: 1px solid #cfd7e1; border-radius: 8px; font: inherit; }
  textarea { resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-size: 14px; }
  .err { color: #b42318; font-size: 13px; min-height: 18px; margin-top: 4px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  button { border: 0; border-radius: 8px; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; background: #1d4ed8; color: #fff; }
  button.alt { background: #e8eefc; color: #1d4ed8; }
  canvas { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.12); background: #fff; }
  .note { font-size: 12px; color: #6b7280; margin-top: 10px; }
</style>
</head>
<body>
<h1>LCS test card generator</h1>
<p class="sub">Makes a plainly marked test card (not an identity document) with a name and IC number, for testing the camera step, OCR and auto-fill.</p>
<main>
  <form class="panel" id="f" autocomplete="off">
    <label for="name">Name</label>
    <input id="name" type="text" value="ALI BIN ABU" maxlength="60">
    <label for="ic">IC number (YYMMDD-PB-####)</label>
    <input id="ic" type="text" value="880808-13-4101" maxlength="14" inputmode="numeric">
    <div class="err" id="icErr"></div>
    <label for="addr">Address (optional)</label>
    <textarea id="addr" rows="3">12 JALAN CONTOH 1
47100 PUCHONG
SELANGOR</textarea>
    <label for="side">Side</label>
    <select id="side"><option value="front">Front</option><option value="back">Back</option></select>
    <div class="row"><input id="photo" type="checkbox"><label for="photo" style="margin:0">Look like a phone photo (tilt, background, shadow)</label></div>
    <div class="btns">
      <button type="button" id="dlPng">Download PNG</button>
      <button type="button" id="dlJpg" class="alt">Download JPG</button>
      <button type="button" id="rand" class="alt">Random details</button>
    </div>
    <p class="note">Downloads work when this file is opened in your browser (double-click it). Every card carries "TEST CARD – NOT AN IDENTITY DOCUMENT".</p>
  </form>
  <div><canvas id="c" width="1012" height="638" aria-label="Test card preview"></canvas></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const W = 1012, H = 638; // credit-card ratio (85.6 × 54 mm)

function formatIc(v) {
  const d = v.replace(/\D/g, '').slice(0, 12);
  return d.length > 8 ? `${d.slice(0, 6)}-${d.slice(6, 8)}-${d.slice(8)}` : d.length > 6 ? `${d.slice(0, 6)}-${d.slice(6)}` : d;
}
function icProblem(ic) {
  if (!/^\d{6}-\d{2}-\d{4}$/.test(ic)) return 'Use the format YYMMDD-PB-#### (12 digits).';
  const mm = +ic.slice(2, 4), dd = +ic.slice(4, 6);
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return 'The first 6 digits must be a date (YYMMDD).';
  return '';
}
function genderOf(ic) { return +ic.slice(-1) % 2 ? 'MALE' : 'FEMALE'; }
function dobOf(ic) {
  const yy = +ic.slice(0, 2), now = new Date().getFullYear() % 100;
  return `${ic.slice(4, 6)}/${ic.slice(2, 4)}/${(yy > now ? 1900 : 2000) + yy}`;
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/** the card itself, drawn on a W×H canvas */
function drawCard(g, d) {
  g.save();
  roundRect(g, 0, 0, W, H, 34); g.clip();
  g.fillStyle = '#fafbfc'; g.fillRect(0, 0, W, H);
  // light grid so it is clearly a printed test sheet
  g.strokeStyle = '#eef1f5'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 28) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 28) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // top band
  g.fillStyle = '#2f3b4c'; g.fillRect(0, 0, W, 86);
  g.fillStyle = '#fff'; g.font = '700 34px Arial, sans-serif'; g.textBaseline = 'middle';
  g.fillText('TEST CARD', 36, 43);
  g.font = '600 20px Arial, sans-serif'; g.textAlign = 'right';
  g.fillText('NOT AN IDENTITY DOCUMENT', W - 36, 43); g.textAlign = 'left';

  g.fillStyle = '#1d2733'; g.textBaseline = 'alphabetic';
  if (d.side === 'front') {
    // IC number, large: what the agent looks for first
    label(g, 'IC NUMBER', 36, 140);
    g.font = '700 50px "Courier New", monospace'; g.fillText(d.ic, 36, 192);
    label(g, 'NAME', 36, 262);
    g.font = '700 34px Arial, sans-serif';
    wrap(g, d.name.toUpperCase(), 36, 302, 600, 40).forEach((l, i) => g.fillText(l, 36, 302 + i * 40));
    if (d.addr.trim()) {
      label(g, 'ADDRESS', 36, 420);
      g.font = '600 26px Arial, sans-serif';
      d.addr.toUpperCase().split(/\n/).slice(0, 4).forEach((l, i) => g.fillText(l.trim(), 36, 456 + i * 32));
    }
    // placeholder face (not a photo)
    g.fillStyle = '#e3e8ef'; roundRect(g, 700, 120, 270, 330, 18); g.fill();
    g.fillStyle = '#b8c2cf';
    g.beginPath(); g.arc(835, 245, 70, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(835, 440, 125, 100, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#6b7685'; g.font = '600 18px Arial, sans-serif'; g.textAlign = 'center';
    g.fillText('PHOTO PLACEHOLDER', 835, 480);
    g.font = '700 22px Arial, sans-serif'; g.fillText(genderOf(d.ic), 835, 520); g.textAlign = 'left';
  } else {
    label(g, 'IC NUMBER', 36, 140);
    g.font = '700 44px "Courier New", monospace'; g.fillText(d.ic, 36, 188);
    label(g, 'DATE OF BIRTH', 36, 256);
    g.font = '700 30px Arial, sans-serif'; g.fillText(dobOf(d.ic), 36, 294);
    label(g, 'GENDER', 360, 256);
    g.fillText(genderOf(d.ic), 360, 294);
    // a fake barcode-like strip, clearly decorative
    g.fillStyle = '#1d2733';
    let x = 36, seed = [...d.ic].reduce((s, ch) => s * 31 + ch.charCodeAt(0), 7);
    while (x < 640) { seed = (seed * 1103515245 + 12345) % 2147483648; const w = 2 + (seed % 5); g.fillRect(x, 360, w, 110); x += w + 2 + ((seed >> 3) % 4); }
    g.font = '600 18px Arial, sans-serif'; g.fillStyle = '#6b7685'; g.fillText('DECORATIVE PATTERN – NOT A BARCODE', 36, 500);
  }
  // diagonal watermark
  g.save(); g.translate(W / 2, H / 2 + 20); g.rotate(-0.32);
  g.fillStyle = 'rgba(200, 40, 40, 0.16)'; g.font = '800 92px Arial, sans-serif'; g.textAlign = 'center';
  g.fillText('TEST ONLY', 0, 0);
  g.font = '700 30px Arial, sans-serif'; g.fillText('NOT VALID FOR ANY PURPOSE', 0, 52);
  g.restore();
  // footer
  g.fillStyle = '#2f3b4c'; g.fillRect(0, H - 44, W, 44);
  g.fillStyle = '#fff'; g.font = '600 17px Arial, sans-serif'; g.textBaseline = 'middle';
  g.fillText('LCS SOFTWARE TESTING · SAMPLE DATA', 36, H - 22);
  g.restore();
  g.strokeStyle = '#c9d1dc'; g.lineWidth = 3; roundRect(g, 1.5, 1.5, W - 3, H - 3, 34); g.stroke();
}
function label(g, t, x, y) { g.save(); g.fillStyle = '#6b7685'; g.font = '700 17px Arial, sans-serif'; g.fillText(t, x, y); g.restore(); }
function wrap(g, text, x, y, max) {
  const words = text.split(/\s+/), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > max && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines.slice(0, 2);
}

function render() {
  const ic = $('ic').value, problem = icProblem(ic);
  $('icErr').textContent = problem;
  const d = { name: $('name').value.trim() || 'NAME', ic: problem ? '000000-00-0000' : ic, addr: $('addr').value, side: $('side').value };
  const out = $('c'), g = out.getContext('2d');
  if (!$('photo').checked) {
    out.width = W; out.height = H; g.clearRect(0, 0, W, H); drawCard(g, d); return;
  }
  // "phone photo": the card slightly tilted on a desk, with a shadow and a little noise
  const card = document.createElement('canvas'); card.width = W; card.height = H; drawCard(card.getContext('2d'), d);
  out.width = 1280; out.height = 960;
  const bg = g.createLinearGradient(0, 0, 1280, 960); bg.addColorStop(0, '#3b3f46'); bg.addColorStop(1, '#22252a');
  g.fillStyle = bg; g.fillRect(0, 0, 1280, 960);
  g.save(); g.translate(640, 490); g.rotate(-0.045);
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 40; g.shadowOffsetY = 18;
  g.drawImage(card, -W / 2, -H / 2); g.restore();
  const img = g.getImageData(0, 0, 1280, 960), p = img.data;
  for (let i = 0; i < p.length; i += 4) { const n = (Math.random() - 0.5) * 14; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(img, 0, 0);
  const glare = g.createRadialGradient(420, 300, 10, 420, 300, 420); glare.addColorStop(0, 'rgba(255,255,255,.18)'); glare.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = glare; g.fillRect(0, 0, 1280, 960);
}

function download(type) {
  if (icProblem($('ic').value)) return;
  const a = document.createElement('a');
  const base = `test-card-${$('ic').value}-${$('side').value}`;
  a.download = `${base}.${type === 'image/png' ? 'png' : 'jpg'}`;
  a.href = $('c').toDataURL(type, 0.92);
  document.body.appendChild(a); a.click(); a.remove();
}

const NAMES = ['ALI BIN ABU', 'SITI NUR AISYAH BINTI AHMAD', 'TAN WEI MING', 'KUMARAN A/L RAJU', 'NURUL IZZAH BINTI HASSAN', 'LIM MEI LING', 'MOHD FAIZAL BIN ISMAIL'];
function random() {
  const y = 60 + Math.floor(Math.random() * 40), m = 1 + Math.floor(Math.random() * 12), d = 1 + Math.floor(Math.random() * 28);
  const pb = ['01', '05', '07', '08', '10', '12', '13', '14'][Math.floor(Math.random() * 8)];
  const tail = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  $('name').value = NAMES[Math.floor(Math.random() * NAMES.length)];
  $('ic').value = `${String(y).padStart(2, '0')}${String(m).padStart(2, '0')}${String(d).padStart(2, '0')}-${pb}-${tail}`;
  render();
}

$('ic').addEventListener('input', (e) => { e.target.value = formatIc(e.target.value); render(); });
['name', 'addr', 'side', 'photo'].forEach((id) => $(id).addEventListener('input', render));
$('side').addEventListener('change', render);
$('dlPng').addEventListener('click', () => download('image/png'));
$('dlJpg').addEventListener('click', () => download('image/jpeg'));
$('rand').addEventListener('click', random);
$('f').addEventListener('submit', (e) => e.preventDefault());
render();
</script>
</body>
</html>
